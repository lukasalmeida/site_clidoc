services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8081}:8000"
    environment:
      APP_NAME: CliDoc
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost:${APP_PORT:-8081}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
