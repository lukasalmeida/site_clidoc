services:
  - type: web
    name: clidoc-site
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: '/bin/sh -c "exec php artisan serve --host=0.0.0.0 --port=${PORT:-10000}"'
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: CliDoc
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://clidoc.onrender.com
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
